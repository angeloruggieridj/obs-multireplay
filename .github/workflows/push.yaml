name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    # contents: write publishes the release; the other two let this job mint a
    # build provenance attestation for every asset, signed with an OIDC token.
    # None of the packages are code-signed (see docs/verification.md) -- the
    # attestation is what replaces a publisher signature.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Optional. Without it the VirusTotal steps below are skipped, not failed,
      # and the release still publishes.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      # THE TAG AND THE BINARY HAVE TO AGREE ON WHAT THIS BUILD IS.
      #
      # The DLL reports buildspec's `version` + `prerelease` (see
      # PLUGIN_VERSION_FULL in CMakeLists.txt); the release is named by the tag.
      # If those two ever diverge, the updater compares the wrong pair of
      # versions and silently stops offering updates to everyone running this
      # build — which is exactly what happened while the binary said "1.0.0" and
      # the tag said "1.0.0-beta7". So they are compared here, and a release
      # whose tag disagrees is not published at all.
      - name: Check Out Sources 📥
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4

      - name: Check Tag Matches buildspec 🧾
        if: github.ref_type == 'tag'
        run: |
          : Check Tag Matches buildspec 🧾
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          version="$(jq -r '.version' buildspec.json)"
          pre="$(jq -r '.prerelease // ""' buildspec.json)"
          declared="${version}"
          [[ -n "${pre}" ]] && declared="${version}-${pre}"

          if [[ "${GITHUB_REF_NAME}" != "${declared}" ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match the version this build reports ('${declared}'). Update buildspec.json's version/prerelease, or retag."
            exit 1
          fi
          echo "tag and buildspec agree on ${declared}"

      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v8
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      # None of the packages are code-signed, so ship something people can check
      # instead: an attestation binding every asset to this workflow, this commit
      # and this runner. GitHub already publishes a SHA-256 per asset from the
      # same source; the attestation covers each asset directly rather than by
      # proxy. `obs-multireplay-1.0.0-*` is the exact set the Rename Files step
      # moved into the workspace -- a per-extension glob would fail on *.exe,
      # which this project has no asset for.
      - name: Attest build provenance 🔏
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ github.workspace }}/obs-multireplay-1.0.0-*

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

      # An independent second opinion, linked from the release page. Needs a free
      # VirusTotal API key in the VT_API_KEY secret; without one both steps are
      # skipped and the release still publishes.
      - name: Scan the packages with VirusTotal 🧬
        id: vt
        if: fromJSON(steps.check.outputs.validTag) && env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f # v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb

      # softprops' own update_release_body only fires on a "release" event and
      # this workflow runs on a tag push, so append the reports here instead.
      # This lands AFTER the "### Checksums" block, so the hand-written changelog
      # still goes in front of both (see CLAUDE.md's release notes).
      - name: Link the VirusTotal reports from the release 🔗
        if: steps.vt.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          : Link the VirusTotal reports from the release 🔗
          {
            echo ''
            echo '### Verification'
            echo ''
            echo '- **Integrity** — compare each asset against the SHA-256 in `### Checksums` above; the in-app updater does this automatically before it installs.'
            echo "- **Provenance** — \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
            echo '- **VirusTotal** —'
            IFS=',' read -ra rows <<< "${ANALYSIS}"
            for row in "${rows[@]}"; do
              echo "  - [$(basename "${row%%=*}")](${row#*=})"
            done
          } >> ${{ github.workspace }}/CHECKSUMS.txt
          gh release edit "${GITHUB_REF_NAME}" --notes-file ${{ github.workspace }}/CHECKSUMS.txt
