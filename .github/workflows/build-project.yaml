name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

  unit-tests:
    name: Unit Tests 🧪
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # THE HIGHEST-VALUE LINES IN THIS FILE, and they were missing.
      #
      # The unit tests were compiled by the plugin build and run by NOTHING:
      # dozens of checks written, none of them executed automatically, on a
      # project whose engine correctness lives in pure headers precisely so it
      # CAN be tested. And two of the bugs the pre-1.0 audit found are
      # platform-shaped in opposite directions - one broke Linux, one broke
      # Windows - which is exactly what "nothing is ever run outside Windows"
      # looks like from the inside.
      #
      # tests/CMakeLists.txt is a project of its own: no obs-deps, no Qt, no
      # FFmpeg, so this job is a couple of minutes on every push rather than a
      # thing somebody remembers to do.
      - name: Configure 🛠️
        run: cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build 🧱
        run: cmake --build build_tests --config RelWithDebInfo --parallel

      - name: Test ✅
        run: ctest --test-dir build_tests -C RelWithDebInfo --output-on-failure

  locale-check:
    name: Check Locale Keys 🔤
    runs-on: ubuntu-24.04
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # A key the panel asks for and no .ini defines is not a warning: OBS hands
      # back the KEY, so the operator reads "Dock.ZoneAngles" on a button. An
      # invariant nobody can check by looking is an invariant that drifts.
      - name: Every key the code asks for exists in every locale 🔤
        run: bash scripts/check-locale-keys.sh

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          local product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v5
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@v7
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

      - uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}

  ubuntu-build:
    name: Build for Ubuntu 🐧
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v5
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      # One .deb per Ubuntu release (see ubuntu-2604-build), so the name says
      # which: their FFmpeg and Qt package names differ, and a .deb for one
      # release does not install on the other. The in-app updater reads the
      # same tag to offer the right one (update_asset::distroTag).
      - name: Name the Package After Its Ubuntu 🏷️
        run: |
          : Name the Package After Its Ubuntu 🏷️
          shopt -s nullglob
          for f in release/*-x86_64-linux-gnu.deb release/*-x86_64-linux-gnu-dbgsym.ddeb; do
            mv -v "$f" "${f/-x86_64-linux-gnu/-x86_64-linux-gnu-${{ matrix.os }}}"
          done

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

      - name: Upload debug symbol artifacts 🪲
        uses: actions/upload-artifact@v7
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*-dbgsym.ddeb

      - uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  # UBUNTU 26.04 — the only Ubuntu OBS 33 is published for. Its own job, and
  # not the template's scripts: those add ppa:obsproject/obs-studio and build
  # against the libobs it ships, and a PPA for a new Ubuntu release may not
  # exist yet. This builds against OBS's own .deb for that release instead
  # (the version obs-compat.json says was last tested), which installs under
  # /usr/local. Same preset, same flags, same CPack package as 24.04.
  ubuntu-2604-build:
    name: Build for Ubuntu 🐧 (ubuntu-26.04)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: check-event
    defaults:
      run:
        shell: bash
    env:
      UBUNTU: ubuntu-26.04
    steps:
      # git before checkout, or actions/checkout falls back to a tarball with
      # no history, and the build number comes from git.
      - name: Install git 🧰
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl jq > /dev/null

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "pluginName=$(jq -r .name buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "pluginVersion=$(jq -r .version buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "obsVersion=$(jq -r .max_tested obs-compat.json)" >> "$GITHUB_OUTPUT"

      - name: Install OBS ${{ steps.setup.outputs.obsVersion }} and Build Dependencies 📦
        run: |
          : Install OBS and Build Dependencies 📦
          obs="${{ steps.setup.outputs.obsVersion }}"
          deb="OBS-Studio-${obs}-Ubuntu-26.04-x86_64.deb"
          curl -fsSLO "https://github.com/obsproject/obs-studio/releases/download/${obs}/${deb}" \
            || { echo "::error::OBS ${obs} publishes no ${deb}"; exit 1; }
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "./${deb}" \
            cmake ninja-build g++ pkg-config file dpkg-dev libsimde-dev libgles2-mesa-dev \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev libcurl4-openssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev > /dev/null
          rm -f "${deb}"
          # OBS's .deb carries no shlibs file, so dpkg-shlibdeps (which CPack
          # runs to write our Depends) would not know which package provides
          # libobs.so.30. It is obs-studio, and that is all this says.
          printf 'libobs 30 obs-studio (>= 32.0)\nlibobs-frontend-api 30 obs-studio (>= 32.0)\n' \
            > /var/lib/dpkg/info/obs-studio.shlibs
          ldconfig

      - name: Build Plugin 🧱
        run: |
          : Build Plugin 🧱
          cmake --preset ubuntu-ci-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH=/usr/local \
            -DENABLE_CCACHE=OFF -DENABLE_TESTS=OFF
          cmake --build build_x86_64 --config ${{ needs.check-event.outputs.config }} --parallel

      # The whole point of building against OBS's .deb: verify it happened.
      - name: Links Against OBS's libobs 🔗
        run: |
          so="$(find build_x86_64 -name obs-multireplay.so -type f | head -1)"
          echo "plugin: $so"
          needed="$(objdump -p "$so" | awk '/NEEDED/ && /libobs/ {print $2}' | sort)"
          echo "$needed"
          echo "$needed" | grep -qx "libobs.so.30" \
            || { echo "::error::expected NEEDED libobs.so.30 (OBS's soname), got: $needed"; exit 1; }

      - name: Package Plugin 📀
        run: |
          : Package Plugin 📀
          cmake --build build_x86_64 --config ${{ needs.check-event.outputs.config }} -t package
          shopt -s nullglob
          for f in release/*-x86_64-linux-gnu.deb release/*-x86_64-linux-gnu-dbgsym.ddeb; do
            mv -v "$f" "${f/-x86_64-linux-gnu/-x86_64-linux-gnu-${UBUNTU}}"
          done
          ls -la release
          dpkg-deb -f release/*-${UBUNTU}.deb Depends

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ubuntu-26.04-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

  # Compiling says nothing about whether the package loads into the OBS people
  # actually install. Each case starts a clean container of that Ubuntu,
  # installs that OBS, installs our .deb with apt, and starts OBS under Xvfb to
  # read in its own log that the plugin was loaded
  # (.github/scripts/linux-load-check.sh). The prerelease case is reported,
  # never enforced.
  linux-load:
    name: Loads into OBS 🐧 (${{ matrix.ubuntu }}, ${{ matrix.obs }})
    needs: [check-event, ubuntu-build, ubuntu-2604-build]
    if: fromJSON(needs.check-event.outputs.package)
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # "stable" and "beta" are max_tested and beta_tested in
          # obs-compat.json, read at run time, so this follows the nightly
          # matrix instead of going stale. OBS publishes no 24.04 .deb from 33 on.
          - { ubuntu: "24.04", obs: ppa, required: true }
          - { ubuntu: "24.04", obs: stable, required: true }
          - { ubuntu: "26.04", obs: stable, required: true }
          - { ubuntu: "26.04", obs: beta, required: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: '*-ubuntu-${{ matrix.ubuntu }}-x86_64-${{ needs.check-event.outputs.commitHash }}'
          merge-multiple: true
      - name: Load Check 🧪
        run: |
          : Load Check 🧪
          deb="$(ls packages/*-ubuntu-${{ matrix.ubuntu }}.deb | head -1)"
          [ -n "$deb" ] || { echo "::error::no package for Ubuntu ${{ matrix.ubuntu }}"; ls -R packages; exit 1; }
          case "${{ matrix.obs }}" in
            stable) obs="$(sed -n 's/.*"max_tested": "\([^"]*\)".*/\1/p' obs-compat.json)" ;;
            beta) obs="$(sed -n 's/.*"beta_tested": "\([^"]*\)".*/\1/p' obs-compat.json)" ;;
            *) obs="${{ matrix.obs }}" ;;
          esac
          if [ -z "$obs" ]; then echo "obs-compat.json names no ${{ matrix.obs }} OBS: nothing to check"; exit 0; fi
          echo "OBS: $obs"
          bash .github/scripts/linux-load-check.sh "$deb" "$obs"

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      # The installer packs the install tree the zip is made from into OBS's
      # plugin folder, in both layouts (installer/obs-multireplay.iss). Its
      # version is buildspec's, pre-release suffix included, so the entry in
      # Apps & features says what the plugin says. The file name carries
      # `version` alone, like every other asset, so the release steps (rename,
      # checksums, attestation) pick it up unchanged.
      - name: Build Installer 🧰
        run: |
          # Build Installer 🧰
          $ErrorActionPreference = 'Stop'
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $Full = $BuildSpec.version
          if ($BuildSpec.prerelease) { $Full = "$($BuildSpec.version)-$($BuildSpec.prerelease)" }
          $Tree = "${{ github.workspace }}/release/${{ needs.check-event.outputs.config }}"
          $Name = "${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-setup"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$Full" "/DAppNumVersion=$($BuildSpec.version)" `
            "/DPkgDir=$Tree" "/O${{ github.workspace }}/release" "/F$Name" installer/obs-multireplay.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          "INSTALLER_PATH=${{ github.workspace }}/release/$Name.exe" >> $env:GITHUB_ENV
          "INSTALLER_VERSION=$Full" >> $env:GITHUB_ENV
          "INSTALL_TREE=$Tree" >> $env:GITHUB_ENV

      # Not a build check: the installer is run for real on the runner, the way
      # an operator would, and what it leaves on disk is inspected. Install, then
      # again over it (the upgrade path), then uninstall. The runner has no OBS,
      # so the "OBS is running" guard is not exercised here.
      - name: Installer Installs, Upgrades and Uninstalls 🧪
        run: |
          # Installer Installs, Upgrades and Uninstalls 🧪
          $ErrorActionPreference = 'Stop'
          $app = "$env:ProgramData\obs-studio\plugins\obs-multireplay"
          $uninstaller = "$env:ProgramData\obs-multireplay\uninstall\unins000.exe"
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{75936079-F41F-48AC-86C7-169BDC21D51A}_is1'
          $shipped = (Get-FileHash "$env:INSTALL_TREE\obs-multireplay\bin\64bit\obs-multireplay.dll").Hash
          foreach ($pass in 'install', 'upgrade') {
            $p = Start-Process $env:INSTALLER_PATH -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-$pass.log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-$pass.log"; throw "$pass exited with $($p.ExitCode)" }
            foreach ($f in 'obs-multireplay.dll', 'bin\64bit\obs-multireplay.dll', 'data\locale\en-US.ini', 'data\locale\it-IT.ini') {
              if (-not (Test-Path "$app\$f")) { throw "after $pass, missing: $app\$f" }
            }
            # Both layouts carry the very binary that was built.
            foreach ($dll in "$app\obs-multireplay.dll", "$app\bin\64bit\obs-multireplay.dll") {
              if ((Get-FileHash $dll).Hash -ne $shipped) { throw "after $pass, $dll is not the built plugin" }
            }
            # The uninstaller lives OUTSIDE the plugin folder, which the in-app
            # updater replaces whole.
            if (Test-Path "$app\uninstall") { throw "after $pass, an uninstaller sits inside the plugin folder" }
            if (-not (Test-Path $uninstaller)) { throw "after $pass, missing: $uninstaller" }
            $shown = (Get-ItemProperty $key).DisplayVersion
            if ($shown -ne $env:INSTALLER_VERSION) { throw "Apps & features shows $shown, expected $env:INSTALLER_VERSION" }
            "ok: $pass"
          }
          # The uninstaller relaunches itself from %TEMP% and returns at once,
          # so wait for its effect rather than for the process.
          Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $app) -or (Test-Path $key) -or (Test-Path $uninstaller)) {
            if ((Get-Date) -gt $deadline) { throw "uninstall left $app, $uninstaller or its Apps & features entry behind" }
            Start-Sleep -Seconds 2
          }
          "ok: uninstalled, nothing left behind"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
