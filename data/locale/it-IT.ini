BO.Blurb="MultiReplay registra attraverso il plugin <b>Branch Output</b>: ogni camera riceve un filtro Branch Output, e il motore di replay legge gli encoder che quel plugin fa girare. Senza, questo pannello funziona ma <b>il REC rifiuta di partire</b>.<br><br>MultiReplay può scaricare il file giusto per questa piattaforma e passarlo all'installer del sistema. Prima di aprire qualsiasi cosa, il download viene confrontato con il checksum che GitHub pubblica per quel file."
BO.Install="Scarica e installa"
BO.OpenPage="Apri la pagina di download"
