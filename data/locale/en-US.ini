Dock.FitCanvasHint="Scale the replay to fill the canvas, keeping its aspect ratio, wherever you placed it (same as Fit to screen). The picture stays at the camera's own resolution — OBS scales it on the GPU. Leave this on with cameras of different resolutions: the replay input changes size with the angle, so no fixed transform fits them all. Off = your transform is left alone."
