<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS MultiReplay</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f232b; --panel2: #262b35; --border: #343a46;
    --text: #e8eaee; --muted: #8b93a3; --accent: #2e7d32; --accent2: #43a047;
    --red: #d32f2f; --orange: #e07b39; --blue: #3a6ea5; --sel: #e07b39;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 10px; }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px;
             background: var(--panel); border: 1px solid var(--border);
             border-radius: 6px 6px 0 0; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { min-width: 28px; text-align: center; padding: 4px 6px; cursor: pointer;
         background: var(--panel2); border: 1px solid var(--border); border-radius: 3px;
         color: var(--muted); user-select: none; }
  .tab.active { background: var(--blue); color: #fff; }
  .spacer { flex: 1; }
  input[type=text], input[type=number], select {
    background: #11141a; color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 7px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
           border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
  button.live { font-weight: 700; padding: 6px 18px; }
  button.live.on { background: var(--red); border-color: var(--red); color: #fff; }

  .grid { background: var(--panel); border: 1px solid var(--border); border-top: 0;
          max-height: 220px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 3px 8px; border-bottom: 1px solid var(--border); text-align: left;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { background: #20324f; color: #cdd6e4; font-weight: 600; position: sticky; top: 0; }
  tr.evrow { cursor: pointer; }
  tr.evrow.sel { background: #5a3517; outline: 1px solid var(--sel); }
  tr.evrow.open td { color: var(--orange); }
  td .note { color: var(--muted); margin-left: 4px; cursor: text; }
  td .speedcell { cursor: pointer; text-decoration: underline dotted; }
  .empty { padding: 20px; text-align: center; color: var(--muted); }
  .delbtn { padding: 0 6px; font-size: 11px; color: var(--muted); background: none; border: none; }
  .delbtn:hover { color: var(--red); }

  .row { display: flex; align-items: center; gap: 8px; padding: 8px;
         background: var(--panel); border: 1px solid var(--border); border-top: 0;
         flex-wrap: wrap; }
  .lbl { color: var(--muted); margin-right: 2px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .angle { min-width: 34px; }

  .transport { display: flex; align-items: center; gap: 8px; padding: 10px 8px;
               background: var(--panel); border: 1px solid var(--border); border-top: 0;
               flex-wrap: wrap; }
  .rec { width: 44px; height: 34px; border-radius: 4px; font-size: 16px; }
  .rec.on { background: var(--red); border-color: var(--red); color: #fff;
            animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  .timecode { font-size: 22px; font-weight: 700; letter-spacing: 1px;
              font-variant-numeric: tabular-nums; padding: 0 12px; }

  .mv { display: grid; gap: 8px; margin-top: 10px;
        grid-template-columns: repeat(auto-fill, minmax(var(--tile, 200px), 1fr)); }

  /* broadcast-style position bar: event markers + A/B playheads + timecodes */
  .posbar { position: relative; flex: 1; height: 34px; background: #11141a;
            border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
            user-select: none; touch-action: none; }
  .posbar .pb-tick { position: absolute; top: 22px; bottom: 0; width: 1px;
                     background: #2a2f3a; }
  .posbar .pb-event { position: absolute; top: 3px; height: 10px; min-width: 3px;
                      background: var(--orange); border-radius: 2px; opacity: .85; }
  .posbar .pb-event.sel { outline: 1px solid #fff; }
  .posbar .pb-head { position: absolute; top: 0; bottom: 0; width: 2px;
                     background: var(--accent2); pointer-events: none; }
  .posbar .pb-head.b { background: var(--blue); }
  .posbar .pb-time { position: absolute; bottom: 1px; font-size: 10px;
                     color: var(--muted); pointer-events: none;
                     font-variant-numeric: tabular-nums; }
  .posbar .pb-time.l { left: 6px; }
  .posbar .pb-time.r { right: 6px; }
  /* tail of the bar not yet indexed for playback (recording in progress) */
  .posbar .pb-unseek { position: absolute; top: 0; bottom: 0; right: 0;
                       pointer-events: none; border-left: 1px solid var(--red);
                       background: repeating-linear-gradient(45deg,
                         rgba(211,47,47,.10) 0 6px, rgba(211,47,47,.22) 6px 12px); }
  #jumpNow.on { background: var(--red); border-color: var(--red); color: #fff; }
  .tile { position: relative; background: #000; border: 1px solid var(--border);
          border-radius: 6px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .tag { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.65);
               padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; }
  .tile.recdot .tag::after { content: " ●"; color: var(--red); }
  .tile.chA .tag { outline: 2px solid var(--accent2); }
  .tile .noimg { position: absolute; inset: 0; display: flex; align-items: center;
                 justify-content: center; color: var(--muted); font-size: 11px; }

  dialog#settingsDlg { background: var(--panel); color: var(--text);
                       border: 1px solid var(--border); border-radius: 8px;
                       padding: 0; max-width: 880px; }
  dialog#settingsDlg::backdrop { background: rgba(0,0,0,.55); }
  .dlghead { display: flex; justify-content: space-between; align-items: center;
             padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .settings { padding: 12px; display: flex; gap: 14px; flex-wrap: wrap;
              align-items: flex-end; }
  .checkfield { display: flex; align-items: center; gap: 6px; color: var(--muted);
                font-size: 12px; }
  /* broadcast-style transport: reverse-play | pause | forward-play */
  .tbtn { min-width: 42px; height: 34px; font-size: 15px; }
  .tbtn.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field span { color: var(--muted); font-size: 11px; }
  .statusline { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .statusline b { color: var(--text); }
  .warn { color: #ffb74d; }
  .m-badge { font-size: 10px; background: var(--blue); color: #fff; padding: 1px 5px;
             border-radius: 3px; vertical-align: middle; margin-left: 4px; }
  @media (max-width: 1000px) { .mv { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="wrap">

  <!-- ① Toolbar: event list tabs / search / LIVE -->
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <input type="text" id="search" placeholder="🔍 Search events…" size="18">
    <button class="live" id="liveBtn" title="Live = mark 'as it happens'. Off = Recorded mode (marks use the position bar time)">LIVE</button>
    <button id="settingsBtn" title="Settings">⚙</button>
  </div>

  <!-- ② Event grid -->
  <div class="grid">
    <table>
      <thead><tr>
        <th style="width:46px">ID</th><th>In</th><th>Out</th><th>Duration</th>
        <th style="width:62px">Speed</th>
        <th>1</th><th>2</th><th>3</th><th>4</th>
        <th>5</th><th>6</th><th>7</th><th>8</th><th></th>
      </tr></thead>
      <tbody id="evbody"></tbody>
    </table>
    <div class="empty" id="evempty">No events in this list yet — use Mark In/Out or −5/−10/−20.</div>
  </div>

  <!-- ③ Marking + angles -->
  <div class="row">
    <span class="lbl">Mark</span>
    <button id="markIn">In</button><button id="markOut">Out</button>
    <button id="markCancel" title="Cancel open event">✕</button>
    <button data-preset="5">−5</button><button data-preset="10">−10</button>
    <button data-preset="20">−20</button>
    <div class="spacer"></div>
    <div class="group">
      <button id="linkAB" class="on" title="Linked A|B">A|B</button>
      <button id="selA" title="Control channel A only">A</button>
      <button id="selB" title="Control channel B only">B</button>
      <span class="lbl" style="margin-left:8px">A</span>
      <span class="group" id="anglesA"></span>
      <span class="lbl" style="margin-left:8px">B</span>
      <span class="group" id="anglesB"></span>
    </div>
    <button id="exportBtn" title="Export selected events (or last event) as MP4 into the session export/ folder">Export Clips</button>
  </div>

  <!-- ④ Transport -->
  <div class="transport">
    <button id="recBtn" class="rec" title="Start/stop continuous recording">●</button>
    <span style="width:8px"></span>
    <button id="stepBack" class="tbtn" title="Frame step −1">⏮</button>
    <button id="revBtn" class="tbtn" title="Play in REVERSE">◀</button>
    <button id="pauseBtn" class="tbtn" title="Pause">⏸</button>
    <button id="playBtn" class="tbtn" title="Play forward">▶</button>
    <button id="stepFwd" class="tbtn" title="Frame step +1">⏭</button>
    <span style="width:8px"></span>
    <button id="playLast" title="Instantly play last event to output (the reference controller ↺)">↺</button>
    <button id="playSel" title="Play selected events to output">Play Events</button>
    <button id="stopEv" title="Stop event playback">⏹</button>
    <button id="loopBtn" title="Loop the playing selection">Loop</button>
    <button id="musicBtn" title="Unmute the configured music source during playback">🎵</button>
    <div class="spacer"></div>
    <span class="timecode" id="timecode">--:--:--</span>
    <span class="group">
      <button class="speed" data-speed="0.25">25%</button>
      <button class="speed" data-speed="0.33">33%</button>
      <button class="speed" data-speed="0.50">50%</button>
      <button class="speed" data-speed="0.75">75%</button>
      <button class="speed on" data-speed="1">100%</button>
      <input type="range" id="speedSlider" min="0" max="100" value="100"
             style="width:110px" title="Slow motion 0–100%">
    </span>
  </div>

  <!-- ⑤ Position bar (broadcast-style: event markers + A/B playheads) -->
  <div class="row" style="border-radius:0 0 6px 6px">
    <div class="posbar" id="posBar"
         title="Master timeline: orange = events, green = A, blue = B. Click/drag to seek">
      <div class="pb-unseek" id="pbUnseek" style="width:0"></div>
      <div class="pb-time l" id="pbTimeL">00:00:00</div>
      <div class="pb-time r" id="pbTimeR">--:--:--</div>
      <div class="pb-head" id="pbHeadA"></div>
      <div class="pb-head b" id="pbHeadB"></div>
    </div>
    <button id="jumpNow" title="Jump to now (latest recorded frame)">⇥ NOW</button>
  </div>

  <!-- ⑥ Multiview: 4 cameras + Replay A/B (MJPEG) -->
  <div class="mv" id="mv"></div>

  <!-- Settings (modal dialog, opened with the ⚙ icon in the toolbar) -->
  <dialog id="settingsDlg">
  <div class="dlghead"><b>⚙ Settings</b>
    <button id="settingsClose" title="Close">✕</button></div>
  <div class="settings">
    <div class="field"><span>Session folder (SSD)</span>
      <input type="text" id="sessionFolder" size="34" placeholder="e.g. D:\replay-session"></div>
    <span id="camFields" style="display:contents"></span>
    <div class="field"><span>Output scene (replay → program)</span>
      <input type="text" id="outputSceneName" size="18" placeholder="REPLAY"></div>
    <div class="field"><span>Split (min)</span>
      <input type="number" id="splitMinutes" min="1" max="60" style="width:64px"></div>
    <div class="field"><span>Bitrate (kbps)</span>
      <input type="number" id="videoBitrateKbps" min="1000" step="500" style="width:84px"></div>
    <div class="field"><span>Video encoder</span>
      <select id="videoEncoderId"><option value="">Auto (hardware first)</option></select></div>
    <div class="field"><span>Music source (OBS audio source)</span>
      <input type="text" id="musicSourceName" size="14" placeholder="ReplayMusic"></div>
    <div class="field"><span>Preview size</span>
      <input type="range" id="tileSize" min="140" max="480" step="10"
             style="width:110px" title="Multiview tile size (saved in this browser)"></div>
    <label class="checkfield" title="On: playing an event switches the OBS scene to the output scene and back. Off: only the Replay source is fed — you switch scenes yourself">
      <input type="checkbox" id="autoSwitchScene" checked> Auto switch scene on play
    </label>
    <button id="saveBtn">Save settings</button>
    <button id="hidBtn" title="Connect a Contour ShuttlePro/Xpress jog controller (experimental, Chrome/Edge)">🎛 Shuttle</button>
    <button id="deleteAllBtn" title="the reference controller Delete All: wipe recordings + events, keep settings"
            style="border-color:var(--red);color:#ff8a80">Delete All</button>
  </div>
  </dialog>

  <div class="statusline" id="statusline">Connecting…</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts) => fetch(path, opts).then(r => r.json());
const post = (path, body) =>
  api(path, { method: "POST", body: JSON.stringify(body || {}) })
    .then(r => { if (!r.ok && r.error) setStatus('<span class="warn">⚠ ' + r.error + "</span>"); return r; });

const NCAMS = 8; // M5: full reference parity
let recording = false, recStartedAt = null;
let transport = null, channelTarget = "A", linked = true, draggingPos = false;
let evState = { list: 1, live: true, events: [] };
let selectedIds = new Set();
let streamBase = null; // dedicated MJPEG port, set in loadConfig

// ---------- dynamic camera fields + A/B angle buttons (1..8) ----------
for (let i = 0; i < NCAMS; i++) {
  const d = document.createElement("div");
  d.className = "field";
  d.innerHTML = `<span>Camera ${i + 1}</span><select id="cam${i}"></select>`;
  $("camFields").appendChild(d);
}
["A", "B"].forEach(ch => {
  const box = $("angles" + ch);
  const p = document.createElement("button");
  p.className = "angle"; p.disabled = true; p.textContent = "P";
  p.title = "Program angle — future";
  box.appendChild(p);
  for (let a = 1; a <= NCAMS; a++) {
    const b = document.createElement("button");
    b.className = "angle ang-" + ch.toLowerCase();
    b.dataset.ch = ch; b.dataset.angle = a; b.textContent = a;
    box.appendChild(b);
  }
});

// ---------- tabs 1..20 ----------
const tabs = $("tabs");
for (let i = 1; i <= 20; i++) {
  const t = document.createElement("div");
  t.className = "tab" + (i === 1 ? " active" : "");
  t.textContent = i;
  t.addEventListener("click", () => {
    post("/api/events/list", { list: i });
    evState.list = i;
    selectedIds.clear();
    document.querySelectorAll(".tab").forEach((el, idx) =>
      el.classList.toggle("active", idx + 1 === i));
    refreshEvents();
  });
  tabs.appendChild(t);
}

// ---------- multiview ----------
const mvDefs = [];
for (let i = 1; i <= NCAMS; i++)
  mvDefs.push({ slot: "cam" + i, tag: "CAM " + i, angle: i });
mvDefs.push({ slot: "a", tag: "A", angle: 0 }, { slot: "b", tag: "B", angle: 0 });
const mv = $("mv");
mvDefs.forEach(def => {
  const d = document.createElement("div");
  d.className = "tile";
  d.id = "tile-" + def.slot;
  d.innerHTML = `<div class="noimg">no signal</div>
    <img alt="${def.tag}" style="display:none">
    <div class="tag">${def.tag}</div>`;
  if (def.angle > 0) {
    d.title = `Click: angle ${def.angle} on channel ${channelTarget}`;
    d.addEventListener("click", () =>
      post("/api/channel/angle", { channel: channelTarget, angle: def.angle }));
  }
  mv.appendChild(d);
});

// Multiview delivery (M5): true push video — one persistent MJPEG stream per
// tile served from a DEDICATED port (port+1). Browsers cap connections at 6
// per host:port, so streams on their own port leave the REST API untouched.
// If the stream port is unreachable (firewall), the tile silently falls back
// to JPEG snapshot polling on the main port.
let camConfigured = new Array(NCAMS).fill(false); // updated by loadConfig/save
mvDefs.forEach((def, idx) => {
  const tile = $("tile-" + def.slot);
  const img = tile.querySelector("img");
  const noimg = tile.querySelector(".noimg");
  let mode = "stream";         // "stream" | "poll"
  let streamOn = false;
  let busy = false, failures = 0, lastUrl = null;
  const showNoSignal = () => { img.style.display = "none"; noimg.style.display = ""; };
  const showImg = () => { img.style.display = ""; noimg.style.display = "none"; };
  // visible: should the tile occupy space? (A/B are ALWAYS visible)
  const visible = () => def.angle > 0 ? camConfigured[idx] : true;
  // feedable: can it actually receive frames right now?
  const eligible = () =>
    def.angle > 0 ? camConfigured[idx]
                  : !!(transport && transport.sessionLoaded);

  function startStream() {
    streamOn = true;
    img.onload = () => { showImg(); };
    img.onerror = () => { // stream port unreachable -> polling fallback
      mode = "poll"; streamOn = false;
      img.onload = img.onerror = null;
      img.removeAttribute("src");
    };
    img.src = streamBase + "/preview/" + def.slot;
  }
  function stopStream() {
    streamOn = false;
    img.onload = img.onerror = null;
    img.removeAttribute("src");
    showNoSignal();
  }

  setInterval(async () => {
    if (document.hidden) return;
    // unconfigured camera tiles are hidden; A/B always stay visible
    tile.style.display = visible() ? "" : "none";
    if (!eligible()) {
      if (streamOn) stopStream(); else showNoSignal();
      return;
    }

    if (mode === "stream") {
      if (!streamBase) return;        // config not loaded yet
      if (!streamOn) startStream();
      return;                          // push stream: nothing to poll
    }

    // --- polling fallback (~5 fps) ---
    if (busy) return;
    busy = true;
    try {
      const r = await fetch("/preview/" + def.slot + ".jpg?t=" + Date.now());
      if (r.ok) {
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        img.src = url;
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
        showImg();
        failures = 0;
      } else if (++failures > 5) {
        showNoSignal();
      }
    } catch (e) {
      if (++failures > 5) showNoSignal();
    }
    busy = false;
  }, 200 + idx * 7);
});

// ---------- formatting ----------
function fmtTimecode(ns) {
  const s = ns / 1e9;
  const p = (n) => String(Math.floor(n)).padStart(2, "0");
  const cs = Math.floor((s % 1) * 100);
  return `${p(s/3600)}:${p(s/60%60)}:${p(s%60)}.${String(cs).padStart(2,"0")}`;
}
function fmtBytes(b) {
  if (b < 0) return "?";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(1) + " " + u[i];
}
function setStatus(msg) { $("statusline").innerHTML = msg; }

// ---------- events grid ----------
async function refreshEvents() {
  let data;
  try { data = await api("/api/events?list=" + evState.list); } catch { return; }
  evState.events = data.events || [];
  evState.live = data.liveMode;
  $("liveBtn").classList.toggle("on", evState.live);

  const q = $("search").value.trim().toLowerCase();
  const tbody = $("evbody");
  tbody.innerHTML = "";
  let shown = 0;
  evState.events.forEach(ev => {
    const notes = ev.angles.map(a => a.note || "").join(" ").toLowerCase();
    if (q && !notes.includes(q) && !String(ev.id).includes(q)) return;
    shown++;
    const tr = document.createElement("tr");
    tr.className = "evrow" + (selectedIds.has(ev.id) ? " sel" : "") +
                   (ev.tOutNs < 0 ? " open" : "");
    const dur = ev.tOutNs >= 0 ? fmtTimecode(ev.tOutNs - ev.tInNs) : "(open)";
    const spd = ev.speed >= 0 ? Math.round(ev.speed * 100) + "%" : "--";
    let html = `<td>${String(ev.id).padStart(3, "0")}</td>
      <td>${fmtTimecode(ev.tInNs)}</td>
      <td>${ev.tOutNs >= 0 ? fmtTimecode(ev.tOutNs) : "—"}</td>
      <td>${dur}</td>
      <td><span class="speedcell" title="Click: set speed (empty = --)">${spd}</span></td>`;
    ev.angles.forEach((a, i) => {
      html += `<td><input type="checkbox" data-angle="${i + 1}" ${a.enabled ? "checked" : ""}>
        <span class="note" data-angle="${i + 1}" title="Double-click: edit note">${a.note || "-"}</span></td>`;
    });
    html += `<td><button class="delbtn" title="Delete event">✕</button></td>`;
    tr.innerHTML = html;

    tr.addEventListener("click", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" ||
          e.target.classList.contains("speedcell") || e.target.classList.contains("note")) return;
      if (!e.ctrlKey && !e.metaKey) selectedIds.clear();
      if (selectedIds.has(ev.id)) selectedIds.delete(ev.id); else selectedIds.add(ev.id);
      refreshEvents();
    });
    tr.querySelectorAll("input[type=checkbox]").forEach(cb =>
      cb.addEventListener("change", () =>
        post("/api/events/edit", { id: ev.id, op: "toggleAngle", angle: +cb.dataset.angle })));
    tr.querySelectorAll(".note").forEach(n =>
      n.addEventListener("dblclick", () => {
        const text = prompt("Note for angle " + n.dataset.angle + ":",
                            n.textContent === "-" ? "" : n.textContent);
        if (text !== null)
          post("/api/events/edit", { id: ev.id, op: "note", angle: +n.dataset.angle, text });
      }));
    tr.querySelector(".speedcell").addEventListener("click", () => {
      const v = prompt("Event speed % (empty = -- inherit):", spd === "--" ? "" : spd.replace("%",""));
      if (v === null) return;
      post("/api/events/edit", { id: ev.id, op: "speed", value: v === "" ? -1 : +v / 100 });
    });
    tr.querySelector(".delbtn").addEventListener("click", () => {
      selectedIds.delete(ev.id);
      post("/api/events/edit", { id: ev.id, op: "remove" }).then(refreshEvents);
    });
    tbody.appendChild(tr);
  });
  $("evempty").style.display = shown ? "none" : "block";
}

$("search").addEventListener("input", refreshEvents);
$("liveBtn").addEventListener("click", () =>
  post("/api/events/mode", { live: !evState.live }).then(refreshEvents));
$("markIn").addEventListener("click", () => post("/api/events/markIn").then(refreshEvents));
$("markOut").addEventListener("click", () => post("/api/events/markOut").then(refreshEvents));
$("markCancel").addEventListener("click", () => post("/api/events/markCancel").then(refreshEvents));
document.querySelectorAll("[data-preset]").forEach(b =>
  b.addEventListener("click", () =>
    post("/api/events/markInOut", { seconds: +b.dataset.preset }).then(refreshEvents)));

const wantSwitch = () => $("autoSwitchScene").checked;
$("playLast").addEventListener("click", () =>
  post("/api/play/last", { toOutput: wantSwitch() }));
$("playSel").addEventListener("click", () =>
  post("/api/play/selected",
       { toOutput: wantSwitch(), ids: [...selectedIds].map(id => ({ id })) }));
$("stopEv").addEventListener("click", () => post("/api/play/stop"));

// ---------- M4: loop / music / export / delete all ----------
let flags = { loop: false, music: false };
async function refreshFlags() {
  try { flags = await api("/api/play/flags"); } catch { return; }
  $("loopBtn").classList.toggle("on", flags.loop);
  $("musicBtn").classList.toggle("on", flags.music);
}
$("loopBtn").addEventListener("click", () =>
  post("/api/play/loop", { enabled: !flags.loop }).then(refreshFlags));
$("musicBtn").addEventListener("click", () =>
  post("/api/play/music", { enabled: !flags.music }).then(refreshFlags));

$("exportBtn").addEventListener("click", async () => {
  if (selectedIds.size === 0) {
    const r = await post("/api/export/last");
    if (r.ok) setStatus("Export of last event started → export/ folder.");
    return;
  }
  for (const id of selectedIds) await post("/api/export/event", { id });
  setStatus(`Export of ${selectedIds.size} event(s) started → export/ folder.`);
});

$("deleteAllBtn").addEventListener("click", async () => {
  if (!confirm("Delete ALL recordings and events in the session folder?\n" +
               "Settings, music and tags are kept (the reference controller Delete All)."))
    return;
  const r = await post("/api/session/deleteAll");
  if (r.ok) {
    selectedIds.clear();
    setStatus("Session wiped.");
    // Reset timeline state immediately so the bar shows 0 duration, not the
    // stale values from before the wipe (next refreshTransport() confirms).
    sample = null;
    transport = null;
    $("pbTimeR").textContent = "--:--:--";
    $("pbUnseek").style.width = "0";
    $("pbHeadA").style.left = "0";
    $("pbHeadB").style.left = "0";
    refreshEvents();
    refreshTransport();
  }
});

// ---------- M4: keyboard shortcuts (broadcast-style) ----------
document.addEventListener("keydown", (e) => {
  const t = e.target.tagName;
  if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); cmd("/api/transport/playPause"); }
  else if (e.key === "ArrowLeft") cmd("/api/transport/jumpFrames", { value: e.shiftKey ? -10 : -1 });
  else if (e.key === "ArrowRight") cmd("/api/transport/jumpFrames", { value: e.shiftKey ? 10 : 1 });
  else if (k === "i") post("/api/events/markIn").then(refreshEvents);
  else if (k === "o") post("/api/events/markOut").then(refreshEvents);
  else if (k === "l") post("/api/events/mode", { live: !evState.live }).then(refreshEvents);
  else if (k === "p") post("/api/play/last", { toOutput: wantSwitch() });
  else if (k === "d") cmd("/api/transport/changeDirection");
  else if (k === "n") cmd("/api/transport/jumpToNow");
  else if (["1","2","3","4","5","6","7","8"].includes(k))
    post("/api/channel/angle", { channel: channelTarget, angle: +k });
  else if (k === "z") post("/api/events/markInOut", { seconds: 5 }).then(refreshEvents);
  else if (k === "x") post("/api/events/markInOut", { seconds: 10 }).then(refreshEvents);
  else if (k === "c") post("/api/events/markInOut", { seconds: 20 }).then(refreshEvents);
});

// ---------- recording / status ----------
async function loadSources() {
  const data = await api("/api/sources");
  for (let i = 0; i < NCAMS; i++) {
    const sel = $("cam" + i);
    const current = sel.value;
    sel.innerHTML = '<option value="">— not used —</option>';
    (data.sources || []).forEach(s => {
      const o = document.createElement("option");
      o.value = s.name; o.textContent = s.name;
      sel.appendChild(o);
    });
    sel.value = current;
  }
}
async function loadEncoders() {
  const data = await api("/api/encoders");
  (data.encoders || []).forEach(e => {
    const o = document.createElement("option");
    o.value = e.id; o.textContent = e.name;
    $("videoEncoderId").appendChild(o);
  });
}
async function loadConfig() {
  const cfg = await api("/api/config");
  $("sessionFolder").value = cfg.sessionFolder || "";
  $("outputSceneName").value = cfg.outputSceneName || "";
  $("musicSourceName").value = cfg.musicSourceName || "";
  $("autoSwitchScene").checked = cfg.autoSwitchScene !== false;
  $("splitMinutes").value = cfg.splitMinutes || 20;
  $("videoBitrateKbps").value = cfg.videoBitrateKbps || 12000;
  $("videoEncoderId").value = cfg.videoEncoderId || "";
  (cfg.cameras || []).forEach((c, i) => {
    if (i < NCAMS) {
      $("cam" + i).value = c.sourceName || "";
      camConfigured[i] = !!c.sourceName;
    }
  });
  // dedicated MJPEG stream port = REST port + 1
  if (cfg.port)
    streamBase = location.protocol + "//" + location.hostname + ":" + (cfg.port + 1);
}
$("saveBtn").addEventListener("click", async () => {
  const r = await post("/api/config", {
    sessionFolder: $("sessionFolder").value.trim(),
    outputSceneName: $("outputSceneName").value.trim(),
    musicSourceName: $("musicSourceName").value.trim(),
    autoSwitchScene: $("autoSwitchScene").checked,
    splitMinutes: +$("splitMinutes").value,
    videoBitrateKbps: +$("videoBitrateKbps").value,
    videoEncoderId: $("videoEncoderId").value,
    cameras: Array.from({ length: NCAMS },
                        (_, i) => ({ sourceName: $("cam" + i).value })),
  });
  if (r.ok) {
    setStatus("Settings saved.");
    for (let i = 0; i < NCAMS; i++) camConfigured[i] = !!$("cam" + i).value;
  }
});

async function refreshStatus() {
  let st;
  try { st = await api("/api/status"); }
  catch { setStatus('<span class="warn">Connection to OBS lost — is OBS running?</span>'); return; }
  recording = st.recording;
  $("recBtn").classList.toggle("on", recording);
  if (recording && !recStartedAt) recStartedAt = Date.now();
  if (!recording) recStartedAt = null;
  (st.cameras || []).forEach((c, i) => {
    const tile = $("tile-cam" + (i + 1));
    if (tile) tile.classList.toggle("recdot", !!c.recording);
  });
  let line = `v<b>${st.version || "?"}</b> · Encoder: <b>${st.videoEncoder}</b> · Disk free: <b>${fmtBytes(st.diskFreeBytes)}</b>`;
  if (st.estimatedMinutesRemaining >= 0)
    line += ` · Remaining: <b>${Math.floor(st.estimatedMinutesRemaining / 60)}h ${st.estimatedMinutesRemaining % 60}m</b>`;
  if (!st.branchOutputAvailable)
    line = '<span class="warn">⚠ Branch Output plugin not installed — recording unavailable.</span><br>' + line;
  setStatus(line);
}
$("recBtn").addEventListener("click", async () => {
  await post("/api/recording/" + (recording ? "stop" : "start"));
  refreshStatus();
});

// ---------- transport ----------
const cmd = (path, body) =>
  post(path, Object.assign({ channel: channelTarget }, body || {}));

function setLinkMode(mode) {
  linked = mode === "AB";
  channelTarget = mode === "B" ? "B" : "A";
  post("/api/channel/link", { linked });
  $("linkAB").classList.toggle("on", mode === "AB");
  $("selA").classList.toggle("on", mode === "A");
  $("selB").classList.toggle("on", mode === "B");
}
$("linkAB").addEventListener("click", () => setLinkMode("AB"));
$("selA").addEventListener("click", () => setLinkMode("A"));
$("selB").addEventListener("click", () => setLinkMode("B"));

document.querySelectorAll(".ang-a, .ang-b").forEach(btn =>
  btn.addEventListener("click", () =>
    post("/api/channel/angle", { channel: btn.dataset.ch, angle: +btn.dataset.angle })));

// broadcast-style transport: ◀ = play reverse, ▶ = play forward, ⏸ = pause.
async function playDirection(reverse) {
  const ch = transport && (transport[channelTarget] || transport.A);
  if (ch && ch.reverse !== reverse) await cmd("/api/transport/changeDirection");
  cmd("/api/transport/play");
}
$("playBtn").addEventListener("click", () => playDirection(false));
$("revBtn").addEventListener("click", () => playDirection(true));
$("pauseBtn").addEventListener("click", () => cmd("/api/transport/pause"));
$("stepBack").addEventListener("click", () => cmd("/api/transport/jumpFrames", { value: -1 }));
$("stepFwd").addEventListener("click", () => cmd("/api/transport/jumpFrames", { value: 1 }));
$("jumpNow").addEventListener("click", () => cmd("/api/transport/jumpToNow"));

// Settings dialog
$("settingsBtn").addEventListener("click", () => $("settingsDlg").showModal());
$("settingsClose").addEventListener("click", () => $("settingsDlg").close());
document.querySelectorAll(".speed[data-speed]").forEach(btn =>
  btn.addEventListener("click", () => {
    cmd("/api/transport/speed", { value: +btn.dataset.speed });
    $("speedSlider").value = Math.round(+btn.dataset.speed * 100);
  }));
$("speedSlider").addEventListener("input", () =>
  cmd("/api/transport/speed", { value: +$("speedSlider").value / 100 }));
// ---------- broadcast-style position bar ----------
const posBar = $("posBar");
let lastSeekSent = 0;
function barSeek(clientX, force) {
  if (!transport || !transport.durationNs) return;
  const rect = posBar.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  const now = Date.now();
  if (!force && now - lastSeekSent < 120) return; // throttle while dragging
  lastSeekSent = now;
  // Use interpolated duration so the bar spans up to the true live edge,
  // not the 400ms-stale sampled value.
  let dur = transport.durationNs;
  if (sample && sample.recording && dur > 0)
    dur = dur + (performance.now() - sample.t) * 1e6;
  const maxSeek = (transport.seekableNs || transport.durationNs) - 1;
  const ns = Math.min(Math.round(frac * dur), Math.max(maxSeek, 0));
  cmd("/api/transport/seek", { positionNs: ns });
  // Optimistic local update: playhead follows the pointer instantly.
  if (sample) {
    sample.A.positionNs = ns;
    sample.B.positionNs = ns;
    sample.t = performance.now();
  }
}
posBar.addEventListener("pointerdown", (e) => {
  draggingPos = true;
  posBar.setPointerCapture(e.pointerId);
  barSeek(e.clientX, true);
});
posBar.addEventListener("pointermove", (e) => { if (draggingPos) barSeek(e.clientX); });
posBar.addEventListener("pointerup", (e) => {
  if (draggingPos) barSeek(e.clientX, true);
  draggingPos = false;
});

// Event markers on the bar (orange = events of the selected list).
// Rebuilt ONLY when events/duration actually change, and never while the
// user is interacting with the bar — clicking a marker can't race a refresh.
let lastBarSig = "";
function renderBarEvents() {
  if (draggingPos) return;
  if (!transport || !transport.durationNs) return;
  const dur = transport.durationNs;
  const sig = evState.events.map(e => e.id + ":" + e.tInNs + ":" + e.tOutNs).join(",") +
              "|" + [...selectedIds].join(",") + "|" + Math.round(dur / 2e9);
  if (sig === lastBarSig) return;
  lastBarSig = sig;
  posBar.querySelectorAll(".pb-event").forEach(el => el.remove());
  evState.events.forEach(ev => {
    if (ev.tOutNs < 0 || ev.tInNs > dur) return;
    const el = document.createElement("div");
    el.className = "pb-event" + (selectedIds.has(ev.id) ? " sel" : "");
    el.style.left = (ev.tInNs / dur * 100) + "%";
    el.style.width = Math.max(0.3, (ev.tOutNs - ev.tInNs) / dur * 100) + "%";
    el.title = "Event " + ev.id + " — click to select";
    el.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      selectedIds.clear(); selectedIds.add(ev.id);
      cmd("/api/transport/seek", { positionNs: ev.tInNs });
      refreshEvents();
    });
    posBar.appendChild(el);
  });
}

// M6: the transport is SAMPLED every 400ms but RENDERED at display rate —
// playhead, timecode, right timecode, red zone and event marker positions
// are all interpolated client-side at 60fps so nothing ever jumps.
//
// sample fields:
//   t          – performance.now() at sample time
//   durationNs – timeline length at sample time
//   seekableNs – indexed portion at sample time (red zone = dur-seekable)
//   recording  – true while REC is active (durationNs grows at 1ns/ms)
//   A, B       – channel snapshots { positionNs, playing, reverse, speed }
let sample = null;
async function refreshTransport() {
  try { transport = await api("/api/transport"); } catch { return; }
  if (!transport.sessionLoaded) return;
  sample = {
    t:          performance.now(),
    durationNs: transport.durationNs,
    seekableNs: transport.seekableNs || transport.durationNs,
    recording:  !!transport.recording,
    A: { ...transport.A },
    B: { ...transport.B },
  };
  const ch = transport[channelTarget] || transport.A;
  $("playBtn").classList.toggle("on", ch.playing && !ch.reverse);
  $("revBtn").classList.toggle("on", ch.playing && ch.reverse);
  $("pauseBtn").classList.toggle("on", !ch.playing);
  $("pbHeadB").style.display = transport.linked ? "none" : "";
  $("jumpNow").classList.toggle("on", !!transport.followLive);
  // DOM structural rebuild of event markers (throttled by signature —
  // typically runs only when events are added/removed or every ~2 s).
  if (transport.durationNs > 0)
    renderBarEvents();
  document.querySelectorAll(".ang-a").forEach(b =>
    b.classList.toggle("on", +b.dataset.angle === transport.A.angle));
  document.querySelectorAll(".ang-b").forEach(b =>
    b.classList.toggle("on", +b.dataset.angle === transport.B.angle));
  document.querySelectorAll(".speed[data-speed]").forEach(b =>
    b.classList.toggle("on", Math.abs(+b.dataset.speed - ch.speed) < 0.01));
}

// Interpolates the playhead position for one channel.
// seekableNs – the indexed portion of the timeline (hard ceiling):
//   clamping to this prevents the playhead overshooting into the red zone
//   (unindexed buffer) which would cause a visible snap-back on the next
//   poll when seekableNs jumps forward.
// When paused we return positionNs directly (no extrapolation): the server
// position is authoritative and the player will not have moved.
function interpPos(chSample, elapsedMs, seekableNs) {
  let pos = chSample.positionNs;
  if (chSample.playing)
    pos += elapsedMs * 1e6 * chSample.speed * (chSample.reverse ? -1 : 1);
  const ceil = Math.max(seekableNs - 1, 0);
  return Math.min(Math.max(pos, 0), ceil);
}

// Reposition existing event marker <div>s using the current interpolated
// duration — no DOM rebuild, just style updates, so it's safe at 60fps.
function updateBarEventPositions(dur) {
  if (!dur) return;
  const evEls = posBar.querySelectorAll(".pb-event");
  let i = 0;
  evState.events.forEach(ev => {
    if (ev.tOutNs < 0 || ev.tInNs > dur) return;
    if (i >= evEls.length) return;
    evEls[i].style.left  = (ev.tInNs / dur * 100) + "%";
    evEls[i].style.width = Math.max(0.3, (ev.tOutNs - ev.tInNs) / dur * 100) + "%";
    i++;
  });
}

function renderSmooth() {
  requestAnimationFrame(renderSmooth);
  if (!sample || !transport || !transport.sessionLoaded) return;
  const elapsed = performance.now() - sample.t;

  // Interpolate durationNs: during recording it grows at exactly 1 ns/ms.
  let dur = sample.durationNs;
  if (sample.recording && dur > 0)
    dur = dur + elapsed * 1e6;

  // Pass seekableNs as the ceiling so extrapolation never goes into the
  // red zone.  The head position on the bar is then expressed as a
  // fraction of dur (which can be larger than seekableNs during recording).
  const posA = interpPos(sample.A, elapsed, sample.seekableNs);
  const posB = interpPos(sample.B, elapsed, sample.seekableNs);
  if (dur > 0) {
    $("pbHeadA").style.left = (posA / dur * 100) + "%";
    $("pbHeadB").style.left = (posB / dur * 100) + "%";
    // Right timecode and red zone at display rate (was 400ms-stepped before).
    $("pbTimeR").textContent = fmtTimecode(dur).slice(0, 8);
    const unseek = Math.max(0, (1 - sample.seekableNs / dur) * 100);
    $("pbUnseek").style.width = unseek.toFixed(2) + "%";
    // Smoothly reposition event markers as durationNs grows during recording.
    updateBarEventPositions(dur);
  }
  const chPos = channelTarget === "B" ? posB : posA;
  const chSpeed = (channelTarget === "B" ? sample.B : sample.A).speed;
  $("timecode").textContent =
    fmtTimecode(chPos) + "  " + Math.round(chSpeed * 100) + "%";
  $("pbTimeL").textContent = fmtTimecode(chPos).slice(0, 8);
}
requestAnimationFrame(renderSmooth);

function tickClock() {
  if (transport && transport.sessionLoaded) return;
  const el = $("timecode");
  if (recording && recStartedAt) {
    const s = Math.floor((Date.now() - recStartedAt) / 1000);
    const p = (n) => String(n).padStart(2, "0");
    el.textContent = `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
  } else {
    el.textContent = "--:--:--";
  }
}

// ---------- multiview tile size (persisted per-browser) ----------
(function initTileSize() {
  const saved = +localStorage.getItem("mvTileSize") || 200;
  $("tileSize").value = saved;
  document.documentElement.style.setProperty("--tile", saved + "px");
  $("tileSize").addEventListener("input", () => {
    const v = +$("tileSize").value;
    document.documentElement.style.setProperty("--tile", v + "px");
    localStorage.setItem("mvTileSize", v);
  });
})();

// ---------- M5: Web MIDI controller support (optional) ----------
// Default note map (any channel): 36 play/pause · 37 direction · 38 mark in ·
// 39 mark out · 40 play last · 41-44 angle 1-4 · 45 jump to now ·
// 46/47 frame -1/+1 · CC1 (mod wheel) = speed 0-100%.
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess().then(midi => {
    const hook = (input) => input.onmidimessage = (msg) => {
      const [st, d1, d2] = msg.data;
      const type = st & 0xf0;
      if (type === 0x90 && d2 > 0) { // note on
        if (d1 === 36) cmd("/api/transport/playPause");
        else if (d1 === 37) cmd("/api/transport/changeDirection");
        else if (d1 === 38) post("/api/events/markIn").then(refreshEvents);
        else if (d1 === 39) post("/api/events/markOut").then(refreshEvents);
        else if (d1 === 40) post("/api/play/last", { toOutput: true });
        else if (d1 >= 41 && d1 <= 48)
          post("/api/channel/angle", { channel: channelTarget, angle: d1 - 40 });
        else if (d1 === 49) cmd("/api/transport/jumpToNow");
        else if (d1 === 50) cmd("/api/transport/jumpFrames", { value: -1 });
        else if (d1 === 51) cmd("/api/transport/jumpFrames", { value: 1 });
      } else if (type === 0xb0 && d1 === 1) { // CC1 mod wheel -> speed
        cmd("/api/transport/speed", { value: d2 / 127 });
      }
    };
    midi.inputs.forEach(hook);
    midi.onstatechange = (e) => { if (e.port.type === "input") hook(e.port); };
  }).catch(() => {});
}

// ---------- M5: WebHID — Contour ShuttlePro v2 / ShuttleXpress ----------
// Experimental. Jog ring = frame step, shuttle = speed+direction,
// buttons 1-8 = angles, 9 = mark in, 10 = mark out, 11 = play last,
// 12 = play/pause, 13 = jump to now. Requires Chrome/Edge + user gesture.
$("hidBtn").addEventListener("click", async () => {
  if (!navigator.hid) { setStatus("WebHID not available in this browser."); return; }
  let devices;
  try {
    devices = await navigator.hid.requestDevice({
      filters: [{ vendorId: 0x0b33 }], // Contour Design
    });
  } catch (e) { return; }
  if (!devices.length) return;
  const dev = devices[0];
  if (!dev.opened) await dev.open();
  let lastJog = null, lastButtons = 0, lastShuttle = 0;
  dev.oninputreport = (e) => {
    const d = new Uint8Array(e.data.buffer);
    const shuttle = d[0] > 127 ? d[0] - 256 : d[0]; // -7..7
    const jog = d[1];
    const buttons = d.length >= 5 ? d[3] | (d[4] << 8) : 0;

    if (lastJog !== null && jog !== lastJog) {
      let delta = jog - lastJog;
      if (delta > 128) delta -= 256;
      if (delta < -128) delta += 256;
      cmd("/api/transport/jumpFrames", { value: delta });
    }
    lastJog = jog;

    if (shuttle !== lastShuttle) {
      lastShuttle = shuttle;
      if (shuttle === 0) cmd("/api/transport/pause");
      else {
        cmd("/api/transport/speed", { value: Math.abs(shuttle) / 7 });
        post("/api/transport/" + (shuttle < 0 ? "play" : "play"));
        // direction follows the shuttle sign
        if ((shuttle < 0) !== (transport && transport[channelTarget] &&
                               transport[channelTarget].reverse))
          cmd("/api/transport/changeDirection");
      }
    }

    const pressed = buttons & ~lastButtons; // newly pressed
    lastButtons = buttons;
    for (let b = 0; b < 13; b++) {
      if (!(pressed & (1 << b))) continue;
      if (b < 8) post("/api/channel/angle", { channel: channelTarget, angle: b + 1 });
      else if (b === 8) post("/api/events/markIn").then(refreshEvents);
      else if (b === 9) post("/api/events/markOut").then(refreshEvents);
      else if (b === 10) post("/api/play/last", { toOutput: true });
      else if (b === 11) cmd("/api/transport/playPause");
      else if (b === 12) cmd("/api/transport/jumpToNow");
    }
  };
  $("hidBtn").classList.add("on");
  setStatus("Shuttle connected: " + dev.productName);
});

(async function init() {
  // Each loader is independent: one failing endpoint must not leave the UI
  // stuck on "Connecting…".
  try { await Promise.all([loadSources(), loadEncoders()]); }
  catch (e) { console.warn("init sources/encoders:", e); }
  try { await loadConfig(); }
  catch (e) { console.warn("init config:", e); }
  refreshStatus();
  refreshEvents();
  refreshFlags();
  setInterval(refreshStatus, 2000);
  setInterval(refreshEvents, 1500);
  setInterval(refreshTransport, 400);
  setInterval(tickClock, 250);
})();
</script>
