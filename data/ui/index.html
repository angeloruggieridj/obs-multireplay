<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS MultiReplay</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f232b; --panel2: #262b35; --border: #343a46;
    --text: #e8eaee; --muted: #8b93a3; --accent: #2e7d32; --accent2: #43a047;
    --red: #d32f2f; --orange: #e07b39; --blue: #3a6ea5; --sel: #e07b39;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 10px; }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px;
             background: var(--panel); border: 1px solid var(--border);
             border-radius: 6px 6px 0 0; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { min-width: 28px; text-align: center; padding: 4px 6px; cursor: pointer;
         background: var(--panel2); border: 1px solid var(--border); border-radius: 3px;
         color: var(--muted); user-select: none; }
  .tab.active { background: var(--blue); color: #fff; }
  .spacer { flex: 1; }
  input[type=text], input[type=number], select {
    background: #11141a; color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 7px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
           border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.on { background: var(--accent); border-color: var(--accent2); color: #fff; }
  button.live { font-weight: 700; padding: 6px 18px; }
  button.live.on { background: var(--red); border-color: var(--red); color: #fff; }

  .grid { background: var(--panel); border: 1px solid var(--border); border-top: 0;
          max-height: 220px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 3px 8px; border-bottom: 1px solid var(--border); text-align: left;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { background: #20324f; color: #cdd6e4; font-weight: 600; position: sticky; top: 0; }
  tr.evrow { cursor: pointer; }
  tr.evrow.sel { background: #5a3517; outline: 1px solid var(--sel); }
  tr.evrow.open td { color: var(--orange); }
  td .note { color: var(--muted); margin-left: 4px; cursor: text; }
  td .speedcell { cursor: pointer; text-decoration: underline dotted; }
  .empty { padding: 20px; text-align: center; color: var(--muted); }
  .delbtn { padding: 0 6px; font-size: 11px; color: var(--muted); background: none; border: none; }
  .delbtn:hover { color: var(--red); }

  .row { display: flex; align-items: center; gap: 8px; padding: 8px;
         background: var(--panel); border: 1px solid var(--border); border-top: 0;
         flex-wrap: wrap; }
  .lbl { color: var(--muted); margin-right: 2px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .angle { min-width: 34px; }

  .transport { display: flex; align-items: center; gap: 8px; padding: 10px 8px;
               background: var(--panel); border: 1px solid var(--border); border-top: 0;
               flex-wrap: wrap; }
  .rec { width: 44px; height: 34px; border-radius: 4px; font-size: 16px; }
  .rec.on { background: var(--red); border-color: var(--red); color: #fff;
            animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  .timecode { font-size: 22px; font-weight: 700; letter-spacing: 1px;
              font-variant-numeric: tabular-nums; padding: 0 12px; }

  .mv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
  .tile { position: relative; background: #000; border: 1px solid var(--border);
          border-radius: 6px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .tag { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.65);
               padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; }
  .tile.recdot .tag::after { content: " ●"; color: var(--red); }
  .tile.chA .tag { outline: 2px solid var(--accent2); }
  .tile .noimg { position: absolute; inset: 0; display: flex; align-items: center;
                 justify-content: center; color: var(--muted); font-size: 11px; }

  .settings { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
              padding: 10px; margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap;
              align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field span { color: var(--muted); font-size: 11px; }
  .statusline { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .statusline b { color: var(--text); }
  .warn { color: #ffb74d; }
  .m-badge { font-size: 10px; background: var(--blue); color: #fff; padding: 1px 5px;
             border-radius: 3px; vertical-align: middle; margin-left: 4px; }
  @media (max-width: 1000px) { .mv { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="wrap">

  <!-- ① Toolbar: event list tabs / search / LIVE -->
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <input type="text" id="search" placeholder="🔍 Search events…" size="18">
    <button class="live" id="liveBtn" title="Live = mark 'as it happens'. Off = Recorded mode (marks use the position bar time)">LIVE</button>
  </div>

  <!-- ② Event grid -->
  <div class="grid">
    <table>
      <thead><tr>
        <th style="width:46px">ID</th><th>In</th><th>Out</th><th>Duration</th>
        <th style="width:62px">Speed</th><th>1</th><th>2</th><th>3</th><th>4</th><th></th>
      </tr></thead>
      <tbody id="evbody"></tbody>
    </table>
    <div class="empty" id="evempty">No events in this list yet — use Mark In/Out or −5/−10/−20.</div>
  </div>

  <!-- ③ Marking + angles -->
  <div class="row">
    <span class="lbl">Mark</span>
    <button id="markIn">In</button><button id="markOut">Out</button>
    <button id="markCancel" title="Cancel open event">✕</button>
    <button data-preset="5">−5</button><button data-preset="10">−10</button>
    <button data-preset="20">−20</button>
    <div class="spacer"></div>
    <div class="group">
      <button id="linkAB" class="on" title="Linked A|B">A|B</button>
      <button id="selA" title="Control channel A only">A</button>
      <button id="selB" title="Control channel B only">B</button>
      <span class="lbl" style="margin-left:8px">A</span>
      <button class="angle" disabled title="Program angle — M4">P</button>
      <button class="angle ang-a" data-ch="A" data-angle="1">1</button>
      <button class="angle ang-a" data-ch="A" data-angle="2">2</button>
      <button class="angle ang-a" data-ch="A" data-angle="3">3</button>
      <button class="angle ang-a" data-ch="A" data-angle="4">4</button>
      <span class="lbl" style="margin-left:8px">B</span>
      <button class="angle" disabled title="Program angle — M4">P</button>
      <button class="angle ang-b" data-ch="B" data-angle="1">1</button>
      <button class="angle ang-b" data-ch="B" data-angle="2">2</button>
      <button class="angle ang-b" data-ch="B" data-angle="3">3</button>
      <button class="angle ang-b" data-ch="B" data-angle="4">4</button>
    </div>
    <button id="exportBtn" title="Export selected events (or last event) as MP4 into the session export/ folder">Export Clips</button>
  </div>

  <!-- ④ Transport -->
  <div class="transport">
    <button id="recBtn" class="rec" title="Start/stop continuous recording">●</button>
    <button id="playBtn" title="Play/pause">▶</button>
    <button id="dirBtn" title="Change direction (reverse)">◀</button>
    <button id="stepBack" title="Frame step −1">‹</button>
    <button id="stepFwd" title="Frame step +1">›</button>
    <button id="playLast" title="Instantly play last event to output (the reference controller ↺)">↺</button>
    <button id="playSel" title="Play selected events to output">Play Events</button>
    <button id="stopEv" title="Stop event playback">⏹</button>
    <button id="loopBtn" title="Loop the playing selection">Loop</button>
    <button id="musicBtn" title="Unmute the configured music source during playback">🎵</button>
    <div class="spacer"></div>
    <span class="timecode" id="timecode">--:--:--</span>
    <span class="group">
      <button class="speed" data-speed="0.25">25%</button>
      <button class="speed" data-speed="0.33">33%</button>
      <button class="speed" data-speed="0.50">50%</button>
      <button class="speed" data-speed="0.75">75%</button>
      <button class="speed on" data-speed="1">100%</button>
      <input type="range" id="speedSlider" min="0" max="100" value="100"
             style="width:110px" title="Slow motion 0–100%">
    </span>
  </div>

  <!-- ⑤ Position bar -->
  <div class="row" style="border-radius:0 0 6px 6px">
    <input type="range" id="posBar" min="0" max="1000" value="0" style="flex:1"
           title="Position on the synced master timeline">
    <button id="jumpNow" title="Jump to now (latest recorded frame)">⏭|</button>
    <button id="loadSession" title="(Re)index the session folder for playback">⟳ Load session</button>
  </div>

  <!-- ⑥ Multiview: 4 cameras + Replay A/B (MJPEG) -->
  <div class="mv" id="mv"></div>

  <!-- Settings -->
  <div class="settings">
    <div class="field"><span>Session folder (SSD)</span>
      <input type="text" id="sessionFolder" size="34" placeholder="e.g. D:\replay-session"></div>
    <div class="field"><span>Camera 1</span><select id="cam0"></select></div>
    <div class="field"><span>Camera 2</span><select id="cam1"></select></div>
    <div class="field"><span>Camera 3</span><select id="cam2"></select></div>
    <div class="field"><span>Camera 4</span><select id="cam3"></select></div>
    <div class="field"><span>Output scene (replay → program)</span>
      <input type="text" id="outputSceneName" size="18" placeholder="REPLAY"></div>
    <div class="field"><span>Split (min)</span>
      <input type="number" id="splitMinutes" min="1" max="60" style="width:64px"></div>
    <div class="field"><span>Bitrate (kbps)</span>
      <input type="number" id="videoBitrateKbps" min="1000" step="500" style="width:84px"></div>
    <div class="field"><span>Video encoder</span>
      <select id="videoEncoderId"><option value="">Auto (hardware first)</option></select></div>
    <div class="field"><span>Music source (OBS audio source)</span>
      <input type="text" id="musicSourceName" size="14" placeholder="ReplayMusic"></div>
    <button id="saveBtn">Save settings</button>
    <button id="deleteAllBtn" title="the reference controller Delete All: wipe recordings + events, keep settings"
            style="border-color:var(--red);color:#ff8a80">Delete All</button>
  </div>

  <div class="statusline" id="statusline">Connecting…</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts) => fetch(path, opts).then(r => r.json());
const post = (path, body) =>
  api(path, { method: "POST", body: JSON.stringify(body || {}) })
    .then(r => { if (!r.ok && r.error) setStatus('<span class="warn">⚠ ' + r.error + "</span>"); return r; });

let recording = false, recStartedAt = null;
let transport = null, channelTarget = "A", linked = true, draggingPos = false;
let evState = { list: 1, live: true, events: [] };
let selectedIds = new Set();

// ---------- tabs 1..20 ----------
const tabs = $("tabs");
for (let i = 1; i <= 20; i++) {
  const t = document.createElement("div");
  t.className = "tab" + (i === 1 ? " active" : "");
  t.textContent = i;
  t.addEventListener("click", () => {
    post("/api/events/list", { list: i });
    evState.list = i;
    selectedIds.clear();
    document.querySelectorAll(".tab").forEach((el, idx) =>
      el.classList.toggle("active", idx + 1 === i));
    refreshEvents();
  });
  tabs.appendChild(t);
}

// ---------- multiview ----------
const mvDefs = [
  { slot: "cam1", tag: "CAM 1", angle: 1 }, { slot: "cam2", tag: "CAM 2", angle: 2 },
  { slot: "cam3", tag: "CAM 3", angle: 3 }, { slot: "cam4", tag: "CAM 4", angle: 4 },
  { slot: "a", tag: "A", angle: 0 }, { slot: "b", tag: "B", angle: 0 },
];
const mv = $("mv");
mvDefs.forEach(def => {
  const d = document.createElement("div");
  d.className = "tile";
  d.id = "tile-" + def.slot;
  d.innerHTML = `<div class="noimg">no signal</div>
    <img src="/preview/${def.slot}" alt="${def.tag}"
         onload="this.previousElementSibling.style.display='none'"
         onerror="this.style.display='none'">
    <div class="tag">${def.tag}</div>`;
  if (def.angle > 0) {
    d.title = `Click: angle ${def.angle} on channel ${channelTarget}`;
    d.addEventListener("click", () =>
      post("/api/channel/angle", { channel: channelTarget, angle: def.angle }));
  }
  mv.appendChild(d);
});

// ---------- formatting ----------
function fmtTimecode(ns) {
  const s = ns / 1e9;
  const p = (n) => String(Math.floor(n)).padStart(2, "0");
  const cs = Math.floor((s % 1) * 100);
  return `${p(s/3600)}:${p(s/60%60)}:${p(s%60)}.${String(cs).padStart(2,"0")}`;
}
function fmtBytes(b) {
  if (b < 0) return "?";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(1) + " " + u[i];
}
function setStatus(msg) { $("statusline").innerHTML = msg; }

// ---------- events grid ----------
async function refreshEvents() {
  let data;
  try { data = await api("/api/events?list=" + evState.list); } catch { return; }
  evState.events = data.events || [];
  evState.live = data.liveMode;
  $("liveBtn").classList.toggle("on", evState.live);

  const q = $("search").value.trim().toLowerCase();
  const tbody = $("evbody");
  tbody.innerHTML = "";
  let shown = 0;
  evState.events.forEach(ev => {
    const notes = ev.angles.map(a => a.note || "").join(" ").toLowerCase();
    if (q && !notes.includes(q) && !String(ev.id).includes(q)) return;
    shown++;
    const tr = document.createElement("tr");
    tr.className = "evrow" + (selectedIds.has(ev.id) ? " sel" : "") +
                   (ev.tOutNs < 0 ? " open" : "");
    const dur = ev.tOutNs >= 0 ? fmtTimecode(ev.tOutNs - ev.tInNs) : "(open)";
    const spd = ev.speed >= 0 ? Math.round(ev.speed * 100) + "%" : "--";
    let html = `<td>${String(ev.id).padStart(3, "0")}</td>
      <td>${fmtTimecode(ev.tInNs)}</td>
      <td>${ev.tOutNs >= 0 ? fmtTimecode(ev.tOutNs) : "—"}</td>
      <td>${dur}</td>
      <td><span class="speedcell" title="Click: set speed (empty = --)">${spd}</span></td>`;
    ev.angles.forEach((a, i) => {
      html += `<td><input type="checkbox" data-angle="${i + 1}" ${a.enabled ? "checked" : ""}>
        <span class="note" data-angle="${i + 1}" title="Double-click: edit note">${a.note || "-"}</span></td>`;
    });
    html += `<td><button class="delbtn" title="Delete event">✕</button></td>`;
    tr.innerHTML = html;

    tr.addEventListener("click", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" ||
          e.target.classList.contains("speedcell") || e.target.classList.contains("note")) return;
      if (!e.ctrlKey && !e.metaKey) selectedIds.clear();
      if (selectedIds.has(ev.id)) selectedIds.delete(ev.id); else selectedIds.add(ev.id);
      refreshEvents();
    });
    tr.querySelectorAll("input[type=checkbox]").forEach(cb =>
      cb.addEventListener("change", () =>
        post("/api/events/edit", { id: ev.id, op: "toggleAngle", angle: +cb.dataset.angle })));
    tr.querySelectorAll(".note").forEach(n =>
      n.addEventListener("dblclick", () => {
        const text = prompt("Note for angle " + n.dataset.angle + ":",
                            n.textContent === "-" ? "" : n.textContent);
        if (text !== null)
          post("/api/events/edit", { id: ev.id, op: "note", angle: +n.dataset.angle, text });
      }));
    tr.querySelector(".speedcell").addEventListener("click", () => {
      const v = prompt("Event speed % (empty = -- inherit):", spd === "--" ? "" : spd.replace("%",""));
      if (v === null) return;
      post("/api/events/edit", { id: ev.id, op: "speed", value: v === "" ? -1 : +v / 100 });
    });
    tr.querySelector(".delbtn").addEventListener("click", () => {
      selectedIds.delete(ev.id);
      post("/api/events/edit", { id: ev.id, op: "remove" }).then(refreshEvents);
    });
    tbody.appendChild(tr);
  });
  $("evempty").style.display = shown ? "none" : "block";
}

$("search").addEventListener("input", refreshEvents);
$("liveBtn").addEventListener("click", () =>
  post("/api/events/mode", { live: !evState.live }).then(refreshEvents));
$("markIn").addEventListener("click", () => post("/api/events/markIn").then(refreshEvents));
$("markOut").addEventListener("click", () => post("/api/events/markOut").then(refreshEvents));
$("markCancel").addEventListener("click", () => post("/api/events/markCancel").then(refreshEvents));
document.querySelectorAll("[data-preset]").forEach(b =>
  b.addEventListener("click", () =>
    post("/api/events/markInOut", { seconds: +b.dataset.preset }).then(refreshEvents)));

$("playLast").addEventListener("click", () => post("/api/play/last", { toOutput: true }));
$("playSel").addEventListener("click", () =>
  post("/api/play/selected",
       { toOutput: true, ids: [...selectedIds].map(id => ({ id })) }));
$("stopEv").addEventListener("click", () => post("/api/play/stop"));

// ---------- M4: loop / music / export / delete all ----------
let flags = { loop: false, music: false };
async function refreshFlags() {
  try { flags = await api("/api/play/flags"); } catch { return; }
  $("loopBtn").classList.toggle("on", flags.loop);
  $("musicBtn").classList.toggle("on", flags.music);
}
$("loopBtn").addEventListener("click", () =>
  post("/api/play/loop", { enabled: !flags.loop }).then(refreshFlags));
$("musicBtn").addEventListener("click", () =>
  post("/api/play/music", { enabled: !flags.music }).then(refreshFlags));

$("exportBtn").addEventListener("click", async () => {
  if (selectedIds.size === 0) {
    const r = await post("/api/export/last");
    if (r.ok) setStatus("Export of last event started → export/ folder.");
    return;
  }
  for (const id of selectedIds) await post("/api/export/event", { id });
  setStatus(`Export of ${selectedIds.size} event(s) started → export/ folder.`);
});

$("deleteAllBtn").addEventListener("click", async () => {
  if (!confirm("Delete ALL recordings and events in the session folder?\n" +
               "Settings, music and tags are kept (the reference controller Delete All)."))
    return;
  const r = await post("/api/session/deleteAll");
  if (r.ok) { selectedIds.clear(); setStatus("Session wiped."); refreshEvents(); }
});

// ---------- M4: keyboard shortcuts (broadcast-style) ----------
document.addEventListener("keydown", (e) => {
  const t = e.target.tagName;
  if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); cmd("/api/transport/playPause"); }
  else if (e.key === "ArrowLeft") cmd("/api/transport/jumpFrames", { value: e.shiftKey ? -10 : -1 });
  else if (e.key === "ArrowRight") cmd("/api/transport/jumpFrames", { value: e.shiftKey ? 10 : 1 });
  else if (k === "i") post("/api/events/markIn").then(refreshEvents);
  else if (k === "o") post("/api/events/markOut").then(refreshEvents);
  else if (k === "l") post("/api/events/mode", { live: !evState.live }).then(refreshEvents);
  else if (k === "p") post("/api/play/last", { toOutput: true });
  else if (k === "d") cmd("/api/transport/changeDirection");
  else if (k === "n") cmd("/api/transport/jumpToNow");
  else if (["1","2","3","4"].includes(k))
    post("/api/channel/angle", { channel: channelTarget, angle: +k });
  else if (k === "5") post("/api/events/markInOut", { seconds: 5 }).then(refreshEvents);
  else if (k === "6") post("/api/events/markInOut", { seconds: 10 }).then(refreshEvents);
  else if (k === "7") post("/api/events/markInOut", { seconds: 20 }).then(refreshEvents);
});

// ---------- recording / status ----------
async function loadSources() {
  const data = await api("/api/sources");
  for (let i = 0; i < 4; i++) {
    const sel = $("cam" + i);
    const current = sel.value;
    sel.innerHTML = '<option value="">— not used —</option>';
    (data.sources || []).forEach(s => {
      const o = document.createElement("option");
      o.value = s.name; o.textContent = s.name;
      sel.appendChild(o);
    });
    sel.value = current;
  }
}
async function loadEncoders() {
  const data = await api("/api/encoders");
  (data.encoders || []).forEach(e => {
    const o = document.createElement("option");
    o.value = e.id; o.textContent = e.name;
    $("videoEncoderId").appendChild(o);
  });
}
async function loadConfig() {
  const cfg = await api("/api/config");
  $("sessionFolder").value = cfg.sessionFolder || "";
  $("outputSceneName").value = cfg.outputSceneName || "";
  $("musicSourceName").value = cfg.musicSourceName || "";
  $("splitMinutes").value = cfg.splitMinutes || 20;
  $("videoBitrateKbps").value = cfg.videoBitrateKbps || 12000;
  $("videoEncoderId").value = cfg.videoEncoderId || "";
  (cfg.cameras || []).forEach((c, i) => { if (i < 4) $("cam" + i).value = c.sourceName || ""; });
}
$("saveBtn").addEventListener("click", async () => {
  const r = await post("/api/config", {
    sessionFolder: $("sessionFolder").value.trim(),
    outputSceneName: $("outputSceneName").value.trim(),
    musicSourceName: $("musicSourceName").value.trim(),
    splitMinutes: +$("splitMinutes").value,
    videoBitrateKbps: +$("videoBitrateKbps").value,
    videoEncoderId: $("videoEncoderId").value,
    cameras: [0,1,2,3].map(i => ({ sourceName: $("cam" + i).value })),
  });
  if (r.ok) setStatus("Settings saved.");
});

async function refreshStatus() {
  let st;
  try { st = await api("/api/status"); }
  catch { setStatus('<span class="warn">Connection to OBS lost — is OBS running?</span>'); return; }
  recording = st.recording;
  $("recBtn").classList.toggle("on", recording);
  if (recording && !recStartedAt) recStartedAt = Date.now();
  if (!recording) recStartedAt = null;
  (st.cameras || []).forEach((c, i) => {
    const tile = $("tile-cam" + (i + 1));
    if (tile) tile.classList.toggle("recdot", !!c.recording);
  });
  let line = `Encoder: <b>${st.videoEncoder}</b> · Disk free: <b>${fmtBytes(st.diskFreeBytes)}</b>`;
  if (st.estimatedMinutesRemaining >= 0)
    line += ` · Remaining: <b>${Math.floor(st.estimatedMinutesRemaining / 60)}h ${st.estimatedMinutesRemaining % 60}m</b>`;
  if (!st.branchOutputAvailable)
    line = '<span class="warn">⚠ Branch Output plugin not installed — recording unavailable.</span><br>' + line;
  setStatus(line);
}
$("recBtn").addEventListener("click", async () => {
  await post("/api/recording/" + (recording ? "stop" : "start"));
  refreshStatus();
});

// ---------- transport ----------
const cmd = (path, body) =>
  post(path, Object.assign({ channel: channelTarget }, body || {}));

function setLinkMode(mode) {
  linked = mode === "AB";
  channelTarget = mode === "B" ? "B" : "A";
  post("/api/channel/link", { linked });
  $("linkAB").classList.toggle("on", mode === "AB");
  $("selA").classList.toggle("on", mode === "A");
  $("selB").classList.toggle("on", mode === "B");
}
$("linkAB").addEventListener("click", () => setLinkMode("AB"));
$("selA").addEventListener("click", () => setLinkMode("A"));
$("selB").addEventListener("click", () => setLinkMode("B"));

document.querySelectorAll(".ang-a, .ang-b").forEach(btn =>
  btn.addEventListener("click", () =>
    post("/api/channel/angle", { channel: btn.dataset.ch, angle: +btn.dataset.angle })));

$("playBtn").addEventListener("click", () => cmd("/api/transport/playPause"));
$("dirBtn").addEventListener("click", () => cmd("/api/transport/changeDirection"));
$("stepBack").addEventListener("click", () => cmd("/api/transport/jumpFrames", { value: -1 }));
$("stepFwd").addEventListener("click", () => cmd("/api/transport/jumpFrames", { value: 1 }));
$("jumpNow").addEventListener("click", () => cmd("/api/transport/jumpToNow"));
$("loadSession").addEventListener("click", async () => {
  const r = await post("/api/session/load");
  if (r.ok) setStatus("Session indexed for playback.");
});
document.querySelectorAll(".speed[data-speed]").forEach(btn =>
  btn.addEventListener("click", () => {
    cmd("/api/transport/speed", { value: +btn.dataset.speed });
    $("speedSlider").value = Math.round(+btn.dataset.speed * 100);
  }));
$("speedSlider").addEventListener("input", () =>
  cmd("/api/transport/speed", { value: +$("speedSlider").value / 100 }));
$("posBar").addEventListener("pointerdown", () => { draggingPos = true; });
$("posBar").addEventListener("change", () => {
  draggingPos = false;
  if (!transport || !transport.durationNs) return;
  cmd("/api/transport/seek",
      { positionNs: Math.round(+$("posBar").value / 1000 * transport.durationNs) });
});

async function refreshTransport() {
  try { transport = await api("/api/transport"); } catch { return; }
  if (!transport.sessionLoaded) return;
  const ch = transport[channelTarget] || transport.A;
  $("playBtn").textContent = ch.playing ? "⏸" : "▶";
  $("dirBtn").classList.toggle("on", ch.reverse);
  $("timecode").textContent = fmtTimecode(ch.positionNs) + "  " + Math.round(ch.speed * 100) + "%";
  if (!draggingPos && transport.durationNs > 0)
    $("posBar").value = Math.round(ch.positionNs / transport.durationNs * 1000);
  document.querySelectorAll(".ang-a").forEach(b =>
    b.classList.toggle("on", +b.dataset.angle === transport.A.angle));
  document.querySelectorAll(".ang-b").forEach(b =>
    b.classList.toggle("on", +b.dataset.angle === transport.B.angle));
  document.querySelectorAll(".speed[data-speed]").forEach(b =>
    b.classList.toggle("on", Math.abs(+b.dataset.speed - ch.speed) < 0.01));
}

function tickClock() {
  if (transport && transport.sessionLoaded) return;
  const el = $("timecode");
  if (recording && recStartedAt) {
    const s = Math.floor((Date.now() - recStartedAt) / 1000);
    const p = (n) => String(n).padStart(2, "0");
    el.textContent = `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
  } else {
    el.textContent = "--:--:--";
  }
}

(async function init() {
  await Promise.all([loadSources(), loadEncoders()]);
  await loadConfig();
  refreshStatus();
  refreshEvents();
  refreshFlags();
  setInterval(refreshStatus, 2000);
  setInterval(refreshEvents, 1500);
  setInterval(refreshTransport, 400);
  setInterval(tickClock, 250);
})();
</script>
</body>
</html>
